name: MCloud Browser Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Upload Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find release notes
        id: notes
        run: |
          # Notes files are named YYYY-MM-DD-release-notes-mNNN[-suffix].md.
          # Select deterministically by the date prefix in the FILE NAME:
          # `ls -t` sorted by mtime, which git sets to checkout time, so it
          # picked an older release's notes for tag v151.0.7922.99-r2 (defect
          # D46). Prefer a file matching this tag's kernel major, then fall
          # back to the newest date-prefixed file.
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          # Only accept a numeric kernel major before it reaches the shell glob;
          # anything else falls back to the newest date-prefixed notes file.
          case "$MAJOR" in
            ''|*[!0-9]*) MAJOR="" ;;
          esac
          # Optional tag suffix after the version, e.g. r2 for v151.0.7922.99-r2.
          SUFFIX=$(echo "$VERSION" | sed -n 's/^[0-9][0-9.]*-//p')
          CAND=""
          if [ -n "$MAJOR" ] && [ -n "$SUFFIX" ]; then
            case "$SUFFIX" in *[!A-Za-z0-9._-]*) SUFFIX="" ;; esac
          fi
          if [ -n "$MAJOR" ]; then
            if [ -n "$SUFFIX" ]; then
              CAND=$(ls docs/superpowers/specs/*release-notes*m"$MAJOR"*"$SUFFIX"*.md 2>/dev/null | sort -r | head -1)
            fi
            if [ -z "$CAND" ] && [ -z "$SUFFIX" ]; then
              # Plain version tag: prefer the notes file that ends with the
              # kernel major (no release suffix), so old tags do not inherit
              # the newest suffix release's notes.
              CAND=$(ls docs/superpowers/specs/*release-notes*m"$MAJOR".md 2>/dev/null | sort -r | head -1)
            fi
            if [ -z "$CAND" ]; then
              CAND=$(ls docs/superpowers/specs/*release-notes*m"$MAJOR"*.md 2>/dev/null | sort -r | head -1)
            fi
          fi
          if [ -z "$CAND" ]; then
            CAND=$(ls docs/superpowers/specs/*release-notes*.md 2>/dev/null | sort -r | head -1)
          fi
          if [ -f "$CAND" ]; then
            echo "NOTES_FILE=$CAND" >> $GITHUB_OUTPUT
            echo "Found release notes: $CAND"
          else
            echo "No release notes file found, using default"
            echo "NOTES_FILE=" >> $GITHUB_OUTPUT
          fi

      - name: Read release notes
        id: content
        run: |
          if [ -n "${{ steps.notes.outputs.NOTES_FILE }}" ]; then
            # Read the release notes file
            CONTENT=$(cat "${{ steps.notes.outputs.NOTES_FILE }}")
            # Set as output (handle multiline)
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## MCloud Browser v${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Chromium ${{ steps.version.outputs.VERSION }} | AVX2 + FMA3" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksum
        run: |
          if [ -f mini_installer.exe ]; then
            sha256sum mini_installer.exe > mcloud_${{ steps.version.outputs.VERSION }}_win64_mini_installer.exe.sha256
            cat mcloud_${{ steps.version.outputs.VERSION }}_win64_mini_installer.exe.sha256
          else
            echo "mini_installer.exe not found, skipping checksum"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MCloud Browser v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.content.outputs.NOTES }}
          files: |
            mini_installer.exe
            mcloud_${{ steps.version.outputs.VERSION }}_win64_mini_installer.exe.sha256
          draft: false
          prerelease: false
